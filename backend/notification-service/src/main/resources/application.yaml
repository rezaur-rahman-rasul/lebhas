spring:
  application:
    name: notification-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:classpath:application-common.yaml

server:
  port: ${SERVER_PORT:8086}

platform:
  approval:
    kafka:
      notification-consumer-enabled: ${APPROVAL_NOTIFICATION_KAFKA_CONSUMER_ENABLED:true}
      audit-consumer-enabled: ${APPROVAL_AUDIT_KAFKA_CONSUMER_ENABLED:true}
