
    <div class="relative">
      <button
        type="button"
        class="user-profile-trigger"
        data-testid="user-menu-trigger"
        (click)="open.update((value) => !value)"
        aria-haspopup="menu"
        aria-label="Open user menu"
        [attr.aria-expanded]="open()"
      >
        <app-avatar [name]="displayName()" [avatarUrl]="avatarUrl()" size="md" />
      </button>

      @if (open()) {
        <div
          class="absolute right-0 top-[calc(100%+0.75rem)] z-40 w-72 rounded-[var(--app-radius-card)] border border-border bg-surface/95 p-4 shadow-soft backdrop-blur-xl"
          role="menu"
        >
          <div class="flex items-start gap-3">
            <app-avatar [name]="displayName()" [avatarUrl]="avatarUrl()" />
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-semibold text-ink">{{ displayName() }}</p>
              <p class="truncate text-sm text-muted">{{ displayEmail() }}</p>
            </div>
            <app-badge [tone]="badgeTone()">{{ userStore.currentRole() }}</app-badge>
          </div>

          <div class="mt-4 rounded-md border border-border bg-panel/60 px-3 py-3">
            <p class="text-xs font-medium uppercase tracking-[0.12em] text-muted">Workspace</p>
            <p class="mt-1 text-sm font-semibold text-ink">{{ workspaceName() }}</p>
            @if (userStore.activeWorkspaceId()) {
              <p class="mt-1 truncate text-xs text-muted">{{ userStore.activeWorkspaceId() }}</p>
            }
          </div>

          <div class="mt-4 border-t border-border pt-3">
            <button
              type="button"
              class="user-menu-action"
              data-testid="user-menu-profile"
              role="menuitem"
              (click)="goToProfile()"
            >
              <span class="flex items-center gap-2">
                <app-icon name="user-round" [size]="17" />
                My Profile
              </span>
              <app-icon name="chevron-right" [size]="15" />
            </button>

            <button
              type="button"
              class="user-menu-action"
              data-testid="user-menu-settings"
              role="menuitem"
              (click)="goToSettings()"
            >
              <span class="flex items-center gap-2">
                <app-icon name="settings" [size]="17" />
                Account Settings
              </span>
              <app-icon name="chevron-right" [size]="15" />
            </button>

            <button
              type="button"
              class="user-menu-action"
              data-testid="user-menu-security"
              role="menuitem"
              (click)="goToSecurityActivity()"
            >
              <span class="flex items-center gap-2">
                <app-icon name="shield-check" [size]="17" />
                Security Activity
              </span>
              <app-icon name="chevron-right" [size]="15" />
            </button>

            <button
              type="button"
              class="user-menu-action text-muted hover:text-ink"
              data-testid="logout-button"
              role="menuitem"
              (click)="logout()"
            >
              <span class="flex items-center gap-2">
                <app-icon name="log-out" [size]="17" />
                Logout
              </span>
            </button>
          </div>
        </div>
      }
    </div>
