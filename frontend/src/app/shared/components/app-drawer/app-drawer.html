@if (open()) {
  <button
    type="button"
    class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm"
    aria-label="Close drawer backdrop"
    (click)="closed.emit()"
  ></button>

  <aside
    [class]="panelClasses()"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-label]="title() ? null : ariaLabel()"
  >
    <header class="flex items-start justify-between gap-4 border-b border-border px-5 py-4">
      <div class="min-w-0">
        @if (title()) {
          <h2 class="text-lg font-semibold text-ink">{{ title() }}</h2>
        }
        @if (description()) {
          <p class="mt-1 text-sm leading-6 text-muted">{{ description() }}</p>
        }
      </div>
      <button
        type="button"
        class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-md text-muted transition hover:bg-panel hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
        aria-label="Close drawer"
        (click)="closed.emit()"
      >
        <app-icon name="x" [size]="18" />
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto p-5">
      <ng-content />
    </div>
  </aside>
}
