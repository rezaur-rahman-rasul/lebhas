<label class="block">
  <span class="mb-2 block text-sm font-medium text-ink">{{ label() }}</span>
  <span class="relative block">
    <app-icon
      name="lock-keyhole"
      className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
      [size]="17"
    />
    <input
      [type]="revealed() ? 'text' : 'password'"
      [formControl]="control()"
      [placeholder]="placeholder()"
      [autocomplete]="autocomplete()"
      [attr.data-testid]="testId()"
      class="h-12 w-full rounded-xl border border-border bg-surface pl-10 pr-12 text-base text-ink shadow-sm outline-none transition placeholder:text-muted focus:border-brand-500 focus:ring-4 focus:ring-brand-100/60"
    />
    <button
      type="button"
      class="absolute right-3 top-1/2 -translate-y-1/2 rounded-md p-1 text-muted transition hover:bg-panel hover:text-ink"
      [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
      (click)="revealed.update((value) => !value)"
    >
      <app-icon [name]="revealed() ? 'eye-off' : 'eye'" [size]="17" />
    </button>
  </span>

  @if (errorMessage()) {
    <span class="mt-2 block text-sm text-alert-600">{{ errorMessage() }}</span>
  }
</label>
