
<a
  [routerLink]="route()"
  routerLinkActive="bg-brand-100 text-brand-700 dark:bg-brand-500/20 dark:text-brand-100"
  [routerLinkActiveOptions]="{ exact: true }"
  class="group flex h-10 items-center gap-3 rounded-md px-3 text-sm font-medium text-muted transition hover:bg-panel hover:text-ink"
>
      <app-icon [name]="icon()" [size]="18" />
      @if (!compact()) {
        <span class="truncate">{{ label() }}</span>
      }
    </a>
