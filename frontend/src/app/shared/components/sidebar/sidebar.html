<div class="flex h-full flex-col" data-testid="dashboard-sidebar">
  <div class="flex h-16 items-center gap-3 border-b border-border px-4">
    <app-brand-logo size="sm" [elevated]="false" />
    @if (!compact()) {
      <div class="min-w-0">
        <p class="truncate text-sm font-semibold text-ink">{{ brandName() }}</p>
        <p class="truncate text-xs text-muted">{{ workspaceLabel() }}</p>
      </div>
    }
  </div>

  <nav class="flex-1 space-y-1 p-3">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-brand-500/12 text-ink"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex min-h-11 items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-muted transition hover:bg-panel hover:text-ink"
        [attr.data-testid]="'sidebar-link-' + item.label.toLowerCase().replaceAll(' ', '-')"
        (click)="itemSelected.emit()"
      >
        <app-icon [name]="item.icon" [size]="18" />
        @if (!compact()) {
          <span class="truncate">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="border-t border-border p-3">
    <div class="rounded-lg border border-border bg-panel/60 px-3 py-3">
      @if (!compact()) {
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-xs font-medium uppercase tracking-[0.12em] text-muted">Access scope</p>
            <p class="mt-1 text-sm font-semibold text-ink">{{ role() }}</p>
          </div>
          <app-badge [tone]="roleBadgeTone()">{{ role() }}</app-badge>
        </div>
      } @else {
        <div class="grid place-items-center">
          <app-icon name="shield-check" [size]="18" />
        </div>
      }
    </div>
  </div>
</div>
