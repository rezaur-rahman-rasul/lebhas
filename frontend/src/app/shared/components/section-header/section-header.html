<div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
  <div class="max-w-3xl">
    @if (eyebrow()) {
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-brand-500">{{ eyebrow() }}</p>
    }
    <h1 class="mt-2 text-3xl font-semibold text-ink sm:text-[2rem]">{{ title() }}</h1>
    @if (description()) {
      <p class="mt-3 text-sm leading-7 text-muted sm:text-base">{{ description() }}</p>
    }
  </div>

  <div class="flex flex-wrap gap-3">
    <ng-content />
  </div>
</div>
