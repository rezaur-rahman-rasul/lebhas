<section
  class="rounded-[var(--app-radius-card)] border border-red-200 bg-red-50/90 p-5 text-red-900 shadow-sm dark:border-red-400/25 dark:bg-red-500/10 dark:text-red-100"
  role="alert"
>
  <div class="flex gap-3">
    <div class="mt-0.5 grid h-9 w-9 shrink-0 place-items-center rounded-full bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-100">
      <app-icon [name]="icon()" [size]="18" />
    </div>
    <div class="min-w-0">
      <h3 class="text-sm font-semibold">{{ title() }}</h3>
      <p class="mt-1 text-sm leading-6 text-red-800/80 dark:text-red-100/75">{{ description() }}</p>
      <div class="mt-4 flex flex-wrap gap-2"><ng-content /></div>
    </div>
  </div>
</section>
