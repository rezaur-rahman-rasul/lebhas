@if (tone() === 'ghost') {
  <button
    type="button"
    class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-transparent bg-transparent text-muted transition hover:bg-panel hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="ariaLabel()"
    data-testid="theme-toggle"
    (click)="toggleTheme()"
  >
    @switch (theme()) {
      @case ('dark') {
        <app-icon name="sun" [size]="18" />
      }
      @default {
        <app-icon name="moon" [size]="18" />
      }
    }
  </button>
} @else {
  <button
    type="button"
    class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-border bg-surface/90 text-ink shadow-sm backdrop-blur transition hover:bg-panel hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-canvas"
    [attr.aria-label]="ariaLabel()"
    [attr.title]="ariaLabel()"
    data-testid="theme-toggle"
    (click)="toggleTheme()"
  >
    @switch (theme()) {
      @case ('dark') {
        <app-icon name="sun" [size]="18" />
      }
      @default {
        <app-icon name="moon" [size]="18" />
      }
    }
  </button>
}
