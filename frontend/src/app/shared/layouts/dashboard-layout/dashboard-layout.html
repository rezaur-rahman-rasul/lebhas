
    <div class="min-h-screen bg-canvas text-ink">
      @if (layout.sidebarOpen()) {
        <button
          type="button"
          class="fixed inset-0 z-30 bg-slate-950/60 lg:hidden"
          aria-label="Close sidebar"
          (click)="layout.closeSidebar()"
        ></button>
      }

      <aside [class]="sidebarClasses()">
        <app-sidebar
          brandName="Lebhas - Brand Attire"
          [workspaceLabel]="workspaceLabel()"
          [role]="roleLabel()"
          [items]="navigation()"
          [compact]="layout.sidebarCollapsed()"
          (itemSelected)="closeSidebar()"
        />
      </aside>

      <div [class]="contentClasses()">
        <header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-border bg-canvas/90 px-4 backdrop-blur lg:px-6">
          <button
            type="button"
            class="rounded-md p-2 text-muted hover:bg-panel hover:text-ink lg:hidden"
            (click)="layout.openSidebar()"
            aria-label="Open sidebar"
          >
            <app-icon name="menu" [size]="20" />
          </button>

          <button
            type="button"
            class="hidden rounded-md p-2 text-muted hover:bg-panel hover:text-ink lg:inline-flex"
            (click)="layout.toggleCollapsed()"
            aria-label="Toggle sidebar"
          >
            <app-icon name="panel-left" [size]="20" />
          </button>

          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold text-ink">Lebhas workspace shell</p>
            <p class="truncate text-xs text-muted">
              {{ workspaceLabel() }} · {{ roleLabel() }} · {{ workspace.activePlanLabel() }} ·
              Credits: {{ workspace.remainingCreditsLabel() }}
            </p>
          </div>

          @if (workspace.loading()) {
            <app-loading label="Loading workspaces" size="sm" />
          } @else if (workspaceOptions().length > 0) {
            <label class="hidden min-w-0 items-center gap-2 rounded-md border border-border bg-surface px-3 py-2 text-sm text-ink md:flex">
              <span class="shrink-0 text-xs font-semibold uppercase tracking-[0.14em] text-muted">Workspace</span>
              <select
                class="min-w-[12rem] border-0 bg-transparent text-sm font-medium text-ink outline-none"
                [value]="workspace.activeWorkspaceId() ?? ''"
                data-testid="workspace-switcher"
                (change)="changeWorkspace($event)"
              >
                @if (!workspace.activeWorkspaceId()) {
                  <option value="">Select workspace</option>
                }
                @for (option of workspaceOptions(); track option.id) {
                  <option [value]="option.id">{{ option.name }}</option>
                }
              </select>
            </label>
          }

          <app-theme-toggle tone="ghost" />

          <div class="border-l border-border pl-3">
            <app-user-profile-dropdown />
          </div>
        </header>

        <main class="p-4 lg:p-6">
          @defer {
            <router-outlet />
          } @placeholder {
            <div class="grid min-h-[20rem] place-items-center">
              <app-spinner size="lg" />
            </div>
          }
        </main>
      </div>
    </div>
