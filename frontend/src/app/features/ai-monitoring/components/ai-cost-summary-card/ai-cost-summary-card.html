<app-card>
  <div class="flex items-start gap-4">
    <div class="grid h-10 w-10 place-items-center rounded-lg bg-brand-100 text-brand-700 dark:bg-brand-500/20 dark:text-brand-100">
      <app-icon [name]="icon()" [size]="20" />
    </div>
    <div class="min-w-0">
      <p class="text-sm font-medium text-muted">{{ title() }}</p>
      <p class="mt-1 text-2xl font-semibold text-ink">{{ amount() | currency: 'USD' }}</p>
      @if (helperText()) {
        <p class="mt-2 text-sm leading-6 text-muted">{{ helperText() }}</p>
      }
    </div>
  </div>
</app-card>
