<section class="space-y-4" [attr.aria-label]="label()" aria-busy="true">
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (item of skeletonCards.slice(0, cardCount()); track item) {
      <div class="h-36 animate-pulse rounded-lg border border-border bg-surface p-5">
        <div class="h-4 w-32 rounded bg-panel"></div>
        <div class="mt-4 h-7 w-24 rounded bg-panel"></div>
        <div class="mt-6 space-y-2">
          <div class="h-3 rounded bg-panel"></div>
          <div class="h-3 w-2/3 rounded bg-panel"></div>
        </div>
      </div>
    }
  </div>

  <div class="rounded-lg border border-border bg-surface p-5">
    <div class="mb-4 h-4 w-36 rounded bg-panel"></div>
    <div class="space-y-3">
      @for (item of skeletonRows.slice(0, listCount()); track item) {
        <div class="h-12 animate-pulse rounded-md bg-panel"></div>
      }
    </div>
  </div>
</section>
