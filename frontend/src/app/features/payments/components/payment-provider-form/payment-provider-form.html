<app-card>
  <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()" aria-label="Payment provider form">
    <div>
      <h3 class="text-base font-semibold text-ink">Payment provider</h3>
      <p class="mt-1 text-sm leading-6 text-muted">
        Add or update a backend-supported provider. Active providers are loaded from backend configuration.
      </p>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <label class="text-sm">
        <span class="mb-1 block font-medium text-ink">Provider name</span>
        <input class="h-10 w-full rounded-md border border-border bg-canvas px-3 text-sm text-ink focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30" formControlName="name" autocomplete="off" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="mt-1 block text-xs text-red-600">Provider name is required.</span>
        }
      </label>

      <label class="text-sm">
        <span class="mb-1 block font-medium text-ink">Provider code</span>
        <input class="h-10 w-full rounded-md border border-border bg-canvas px-3 text-sm text-ink focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30" formControlName="code" autocomplete="off" />
        @if (form.controls.code.touched && form.controls.code.invalid) {
          <span class="mt-1 block text-xs text-red-600">Provider code is required.</span>
        }
      </label>

      <label class="text-sm">
        <span class="mb-1 block font-medium text-ink">Provider type</span>
        <select class="h-10 w-full rounded-md border border-border bg-canvas px-3 text-sm text-ink focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30" formControlName="providerType">
          @for (type of providerTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </label>

      <label class="text-sm">
        <span class="mb-1 block font-medium text-ink">Priority</span>
        <input class="h-10 w-full rounded-md border border-border bg-canvas px-3 text-sm text-ink focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30" type="number" min="0" formControlName="priority" />
      </label>
    </div>

    <div class="grid gap-3 sm:grid-cols-3">
      <label class="flex items-center gap-2 text-sm text-ink"><input type="checkbox" formControlName="isEnabled" /> Enabled</label>
      <label class="flex items-center gap-2 text-sm text-ink"><input type="checkbox" formControlName="sandboxEnabled" /> Sandbox enabled</label>
      <label class="flex items-center gap-2 text-sm text-ink"><input type="checkbox" formControlName="liveEnabled" /> Live enabled</label>
    </div>

    <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <app-button type="button" variant="ghost" icon="x" ariaLabel="Cancel provider form" (click)="cancelled.emit()">Cancel</app-button>
      <app-button type="submit" icon="save" [loading]="loading()" ariaLabel="Save payment provider">{{ submitLabel() }}</app-button>
    </div>
  </form>
</app-card>
