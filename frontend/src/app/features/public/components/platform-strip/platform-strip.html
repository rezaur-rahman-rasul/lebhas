<section id="platforms" class="border-y border-border bg-surface/50">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <div class="flex flex-col gap-3 lg:flex-row lg:items-end lg:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.16em] text-brand-500">Platform support</p>
        <h2 class="mt-3 text-3xl font-semibold text-ink">Build once, export for every ad destination.</h2>
      </div>
      <p class="max-w-2xl text-sm leading-7 text-muted">
        Start with a single source image and move into creative formats that fit the channel your
        business is actually buying on.
      </p>
    </div>

    <div class="mt-8 grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      @for (platform of platforms; track platform.name) {
        <article class="rounded-3xl border border-border bg-surface p-5 shadow-[0_14px_40px_rgba(2,6,23,0.08)]">
          <div class="grid h-12 w-12 place-items-center rounded-2xl bg-brand-500/12 text-brand-400">
            <app-icon [name]="platform.icon" [size]="20" />
          </div>
          <h3 class="mt-4 text-lg font-semibold text-ink">{{ platform.name }}</h3>
          <p class="mt-3 text-sm leading-7 text-muted">{{ platform.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
