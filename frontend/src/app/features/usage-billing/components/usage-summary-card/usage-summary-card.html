<app-card [interactive]="true">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium text-muted">{{ label() }}</p>
      <p class="mt-3 text-2xl font-semibold text-ink">
        @switch (format()) {
          @case ('currency') {
            {{ value() | currency: 'USD' : 'symbol' : '1.2-2' }}
          }
          @case ('bytes') {
            {{ formatBytes(value()) }}
          }
          @default {
            {{ value() | number: '1.0-2' }}
          }
        }
      </p>
    </div>
    <span [class]="iconClasses()" aria-hidden="true">
      <app-icon [name]="icon()" [size]="18" />
    </span>
  </div>

  @if (helperText()) {
    <p class="mt-4 text-sm leading-6 text-muted">{{ helperText() }}</p>
  }
</app-card>
