<div class="space-y-2">
  <div class="flex items-start justify-between gap-3 text-sm">
    <div class="min-w-0">
      <p class="font-medium text-ink">{{ label() }}</p>
      <p class="mt-0.5 text-xs text-muted">{{ statusText() }}</p>
    </div>
    <p class="shrink-0 text-right text-xs font-semibold text-ink">
      {{ current() | number: '1.0-2' }}
      @if (hasLimit()) {
        <span class="text-muted">/ {{ limit() | number: '1.0-2' }}</span>
      }
    </p>
  </div>

  <div
    class="h-2 overflow-hidden rounded-full bg-panel"
    role="progressbar"
    [attr.aria-label]="label()"
    [attr.aria-valuenow]="displayPercent() ?? null"
    [attr.aria-valuemin]="hasLimit() ? 0 : null"
    [attr.aria-valuemax]="hasLimit() ? 100 : null"
  >
    @if (displayPercent() !== null) {
      <div class="h-full rounded-full transition-all" [class]="barClasses()" [style.width.%]="displayPercent()"></div>
    } @else {
      <div class="h-full w-full rounded-full bg-panel"></div>
    }
  </div>
</div>
