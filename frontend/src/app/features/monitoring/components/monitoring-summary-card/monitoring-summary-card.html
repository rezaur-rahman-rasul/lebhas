<app-card>
  <article class="min-w-0" [attr.aria-label]="title() + ': ' + value()">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="truncate text-sm font-medium text-muted">{{ title() }}</p>
        <p class="mt-2 truncate text-2xl font-semibold text-ink">{{ value() }}</p>
      </div>
      <span [class]="iconClasses()">
        <app-icon [name]="icon()" [size]="18" />
      </span>
    </div>
    @if (description()) {
      <p class="mt-4 line-clamp-2 text-sm leading-6 text-muted">{{ description() }}</p>
    }
  </article>
</app-card>
