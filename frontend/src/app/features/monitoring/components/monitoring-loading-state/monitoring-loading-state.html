<section class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4" [attr.aria-label]="label()" aria-busy="true">
  @for (row of rows(); track row) {
    <article class="rounded-lg border border-border bg-surface p-5">
      <div class="animate-pulse space-y-4">
        <div class="flex justify-between gap-3">
          <div class="space-y-3">
            <div class="h-3 w-28 rounded bg-panel"></div>
            <div class="h-6 w-20 rounded bg-panel"></div>
          </div>
          <div class="size-10 rounded-md bg-panel"></div>
        </div>
        <div class="h-3 w-full rounded bg-panel"></div>
        <div class="h-3 w-2/3 rounded bg-panel"></div>
      </div>
    </article>
  }
</section>
