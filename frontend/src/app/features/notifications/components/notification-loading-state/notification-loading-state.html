<section class="space-y-3" [attr.aria-label]="label()" aria-busy="true">
  @for (item of skeletonCards.slice(0, cardCount()); track item) {
    <article class="rounded-lg border border-border bg-surface p-4">
      <div class="flex gap-3">
        <div class="size-9 animate-pulse rounded-md bg-panel"></div>
        <div class="min-w-0 flex-1 space-y-3">
          <div class="h-4 w-2/3 animate-pulse rounded bg-panel"></div>
          <div class="h-3 w-full animate-pulse rounded bg-panel"></div>
          <div class="h-3 w-1/2 animate-pulse rounded bg-panel"></div>
        </div>
      </div>
    </article>
  }
</section>
