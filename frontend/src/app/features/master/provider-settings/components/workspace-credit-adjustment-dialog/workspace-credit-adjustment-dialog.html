<app-dialog [open]="open()" title="Adjust workspace credits" [description]="workspaceName()" (closed)="close()">
  <form class="panel-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      <span>Adjustment type</span>
      <select formControlName="adjustmentType">
        <option value="ADD">Add credits</option>
        <option value="DEDUCT">Deduct credits</option>
      </select>
    </label>

    <label>
      <span>Amount</span>
      <input type="number" min="0.0001" step="0.01" formControlName="amount" />
    </label>

    <label>
      <span>Reason</span>
      <textarea rows="3" formControlName="description"></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <small role="alert">Reason is required.</small>
      }
    </label>

    <label>
      <span>Reference type</span>
      <input type="text" formControlName="referenceType" />
    </label>

    <div class="actions">
      <app-button type="button" variant="secondary" (click)="close()">Cancel</app-button>
      <app-button type="submit" [loading]="adjusting()">Submit adjustment</app-button>
    </div>
  </form>
</app-dialog>
