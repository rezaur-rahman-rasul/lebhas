<form class="credential-form" [formGroup]="form" (ngSubmit)="submit()" aria-describedby="provider-secret-warning">
  <div class="security-warning" id="provider-secret-warning">
    <app-icon name="shield-check" [size]="18" />
    <p>Provider keys are stored securely on the server and never shown again after saving.</p>
  </div>

  <label>
    <span>Credential name</span>
    <input type="text" formControlName="credentialName" autocomplete="off" />
    @if (form.controls.credentialName.touched && form.controls.credentialName.invalid) {
      <small role="alert">Credential name is required.</small>
    }
  </label>

  <label>
    <span>Environment</span>
    <select formControlName="environment">
      <option value="SANDBOX">Sandbox</option>
      <option value="LIVE">Live</option>
    </select>
  </label>

  <label>
    <span>API key</span>
    <div class="secret-input">
      <input [type]="revealTypedKey() ? 'text' : 'password'" formControlName="apiKey" autocomplete="new-password" />
      <button type="button" [attr.aria-label]="revealTypedKey() ? 'Hide typed API key' : 'Reveal typed API key'" (click)="revealTypedKey.set(!revealTypedKey())">
        <app-icon [name]="revealTypedKey() ? 'eye-off' : 'eye'" [size]="16" />
      </button>
    </div>
    @if (form.controls.apiKey.touched && form.controls.apiKey.invalid) {
      <small role="alert">Provider credential could not be saved. Please check the key and try again.</small>
    }
  </label>

  <label class="checkbox-row">
    <input type="checkbox" formControlName="active" />
    <span>Active credential</span>
  </label>

  <div class="form-actions">
    <app-button type="button" variant="secondary" (click)="close()">Cancel</app-button>
    <app-button type="submit" [loading]="saving()">Save securely</app-button>
  </div>
</form>
