<article class="secret-card">
  <div>
    <p>{{ credential().credentialName }}</p>
    <strong>{{ safeMasked(credential().maskedApiKey) }}</strong>
    <span>{{ credential().environment }} · Updated {{ credential().updatedAt | date: 'medium' }}</span>
  </div>
  <app-status-badge [tone]="credential().active ? 'brand' : 'neutral'">
    {{ credential().active ? 'Active' : 'Inactive' }}
  </app-status-badge>
  <div class="actions">
    <app-button type="button" variant="secondary" size="sm" (click)="rotate.emit(credential())">Rotate / update</app-button>
    <app-button type="button" variant="danger" size="sm" (click)="deactivate.emit(credential())">Deactivate</app-button>
  </div>
</article>
