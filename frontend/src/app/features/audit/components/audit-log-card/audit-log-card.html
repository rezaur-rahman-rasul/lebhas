<app-card [interactive]="true">
  <article class="min-w-0" [attr.aria-label]="'Audit event: ' + auditLog().action">
    <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2">
          <app-audit-severity-badge [severity]="auditLog().severity" />
          <span class="rounded-full border border-border bg-panel px-2.5 py-1 text-xs font-medium text-muted">
            {{ friendlyAuditText(auditLog().module) }}
          </span>
        </div>
        <h3 class="mt-3 line-clamp-2 text-base font-semibold text-ink">{{ friendlyAuditText(auditLog().action) }}</h3>
        <p class="mt-2 line-clamp-2 text-sm leading-6 text-muted">{{ metadataSummary() }}</p>
      </div>
      <p class="shrink-0 text-sm text-muted">{{ auditLog().createdAt }}</p>
    </div>

    <dl class="mt-4 grid gap-3 text-xs text-muted sm:grid-cols-2 lg:grid-cols-4">
      <div class="min-w-0">
        <dt class="font-medium text-ink">Actor</dt>
        <dd class="mt-1 truncate">{{ actorLabel() }}</dd>
      </div>
      <div class="min-w-0">
        <dt class="font-medium text-ink">Reference</dt>
        <dd class="mt-1 truncate">{{ referenceLabel() }}</dd>
      </div>
      <div class="min-w-0">
        <dt class="font-medium text-ink">IP summary</dt>
        <dd class="mt-1 truncate">{{ ipSummary() }}</dd>
      </div>
      <div class="min-w-0">
        <dt class="font-medium text-ink">Device</dt>
        <dd class="mt-1 truncate">{{ userAgentSummary() }}</dd>
      </div>
    </dl>

    <div class="mt-4 flex justify-end">
      <app-button
        type="button"
        variant="ghost"
        size="sm"
        icon="arrow-up-right"
        ariaLabel="Open audit activity details"
        (click)="detailSelected.emit(auditLog())"
      >
        Activity details
      </app-button>
    </div>
  </article>
</app-card>
