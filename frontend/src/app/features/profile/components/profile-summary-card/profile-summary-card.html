<app-card>
  <article class="profile-summary">
    <div class="flex flex-col gap-5 text-center sm:flex-row sm:text-left">
      <div class="flex justify-center sm:block">
        <app-profile-avatar [profile]="profile()" size="xl" />
      </div>

      <div class="min-w-0 flex-1">
        <p class="text-xs font-semibold uppercase tracking-wide text-brand-300">Profile</p>
        <h3 class="mt-1 truncate text-xl font-semibold text-ink">{{ fullName() }}</h3>
        <p class="mt-1 truncate text-sm text-muted">{{ profile().email }}</p>

        <dl class="mt-5 grid gap-3 text-sm sm:grid-cols-2">
          <div class="min-w-0 rounded-md border border-border bg-panel/50 p-3">
            <dt class="text-xs uppercase tracking-wide text-muted">Role</dt>
            <dd class="mt-1 truncate font-medium text-ink">{{ roleLabel() }}</dd>
          </div>
          <div class="min-w-0 rounded-md border border-border bg-panel/50 p-3">
            <dt class="text-xs uppercase tracking-wide text-muted">Workspace</dt>
            <dd class="mt-1 truncate font-medium text-ink">{{ workspaceName() || 'Workspace not selected' }}</dd>
          </div>
          <div class="min-w-0 rounded-md border border-border bg-panel/50 p-3">
            <dt class="text-xs uppercase tracking-wide text-muted">Job title</dt>
            <dd class="mt-1 truncate font-medium text-ink">{{ profile().jobTitle || 'Not added yet' }}</dd>
          </div>
          <div class="min-w-0 rounded-md border border-border bg-panel/50 p-3">
            <dt class="text-xs uppercase tracking-wide text-muted">Phone</dt>
            <dd class="mt-1 truncate font-medium text-ink">{{ profile().phoneNumber || 'Not added yet' }}</dd>
          </div>
        </dl>

        @if (showActions()) {
          <div class="mt-5 flex flex-col gap-2 sm:flex-row sm:flex-wrap">
            <app-button type="button" variant="secondary" size="sm" icon="pencil" (click)="editProfile.emit()">
              Edit profile
            </app-button>
            <app-button type="button" variant="ghost" size="sm" icon="settings" (click)="manageSettings.emit()">
              Settings
            </app-button>
            <app-button type="button" variant="ghost" size="sm" icon="lock-keyhole" (click)="changePassword.emit()">
              Password
            </app-button>
          </div>
        }
      </div>
    </div>
  </article>
</app-card>
