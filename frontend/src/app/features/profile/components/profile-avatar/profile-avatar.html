<div [class]="avatarClasses()" [attr.aria-label]="label()" role="img">
  @if (loading()) {
    <span class="h-1/2 w-1/2 rounded-full bg-surface"></span>
  } @else if (safeImageUrl()) {
    <img [src]="safeImageUrl()!" [alt]="label()" class="h-full w-full object-cover" loading="lazy" />
  } @else {
    <span aria-hidden="true">{{ fallbackInitials() }}</span>
  }
</div>
