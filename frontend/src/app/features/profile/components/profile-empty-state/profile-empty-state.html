<section class="rounded-lg border border-dashed border-border bg-surface p-8 text-center" [attr.aria-label]="title()">
  <div class="mx-auto grid size-12 place-items-center rounded-full bg-panel text-muted">
    <app-icon [name]="icon()" [size]="22" />
  </div>
  <h3 class="mt-4 text-base font-semibold text-ink">{{ title() }}</h3>
  <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-muted">{{ message() }}</p>
</section>
