<div class="space-y-2" aria-live="polite">
  <div class="flex items-center justify-between gap-3 text-xs">
    <span class="font-medium text-muted">Password strength</span>
    <span class="font-semibold text-ink">{{ label() }}</span>
  </div>
  <div
    class="h-2 overflow-hidden rounded-full bg-panel"
    role="meter"
    aria-valuemin="0"
    aria-valuemax="4"
    [attr.aria-valuenow]="score()"
    [attr.aria-label]="'Password strength: ' + label()"
  >
    <div [class]="meterClasses()" [style.width.%]="width()"></div>
  </div>
</div>
