<app-card>
  <article class="flex min-w-0 gap-3" [attr.aria-label]="title()">
    <span class="grid size-10 shrink-0 place-items-center rounded-md bg-brand-500/10 text-brand-200">
      <app-icon name="monitor-smartphone" [size]="18" />
    </span>

    <div class="min-w-0 flex-1">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-base font-semibold text-ink">{{ title() }}</h3>
            @if (session().current) {
              <span class="rounded-full bg-success-500/10 px-2.5 py-1 text-xs font-medium text-success-300">
                This device
              </span>
            }
          </div>
          <p class="mt-1 truncate text-sm text-muted">{{ session().deviceSummary || 'Unknown device' }}</p>
        </div>

        @if (canRevoke()) {
          <app-button
            type="button"
            variant="danger"
            size="sm"
            icon="log-out"
            [loading]="revoking()"
            ariaLabel="Revoke active session"
            (click)="revokeSession.emit(session().sessionId)"
          >
            Revoke
          </app-button>
        }
      </div>

      <dl class="mt-4 grid gap-3 text-xs text-muted sm:grid-cols-3">
        <div class="min-w-0">
          <dt class="font-medium text-ink">Location</dt>
          <dd class="mt-1 truncate">{{ session().ipAddressMasked || 'Masked address' }}</dd>
        </div>
        <div class="min-w-0">
          <dt class="font-medium text-ink">Created</dt>
          <dd class="mt-1 truncate">{{ session().createdAt }}</dd>
        </div>
        <div class="min-w-0">
          <dt class="font-medium text-ink">Last active</dt>
          <dd class="mt-1 truncate">{{ session().lastActiveAt || 'Not available' }}</dd>
        </div>
      </dl>
    </div>
  </article>
</app-card>
