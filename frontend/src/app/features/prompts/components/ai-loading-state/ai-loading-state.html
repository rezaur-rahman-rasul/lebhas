<div
  class="rounded-2xl border border-brand-100 bg-gradient-to-r from-brand-50 via-white to-brand-50 px-4 py-4"
  [class.py-3]="compact()"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <div class="flex items-start gap-3">
    <div class="ai-loading-state__pulse mt-0.5 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-100 text-brand-700">
      <app-icon name="sparkles" [size]="18" />
    </div>
    <div class="min-w-0 flex-1 space-y-2">
      <p class="text-sm font-medium text-ink">{{ title() }}</p>
      @if (!compact()) {
        <p class="text-sm text-muted">{{ description() }}</p>
        <div class="ai-loading-state__shimmer h-2 rounded-full"></div>
        <div class="ai-loading-state__shimmer ai-loading-state__shimmer--delay h-2 w-4/5 rounded-full"></div>
      }
    </div>
  </div>
</div>
