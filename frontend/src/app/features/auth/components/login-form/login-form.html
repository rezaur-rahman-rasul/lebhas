<section class="w-full">
  @if (errorMessage()) {
    <div class="mt-5 rounded-2xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200 dark:text-red-100">
      {{ errorMessage() }}
    </div>
  }

  <form class="mt-6 flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <app-input
      label="Email address"
      type="email"
      autocomplete="username"
      placeholder="Email address"
      icon="mail"
      [testId]="'login-email'"
      [modalPrimary]="true"
      [control]="form.controls.email"
      [error]="emailError()"
    />

    <app-password-input
      label="Password"
      placeholder="Password"
      autocomplete="current-password"
      [testId]="'login-password'"
      [control]="form.controls.password"
      [submitted]="attemptedSubmit()"
      [error]="passwordError()"
    />

    <div class="flex flex-wrap items-center justify-between gap-3">
      <label class="flex items-center gap-3 rounded-xl border border-border bg-surface px-4 py-3 text-sm text-ink">
        <input
          type="checkbox"
          formControlName="rememberMe"
          class="h-4 w-4 rounded border-border text-brand-600 focus:ring-brand-500"
          data-testid="login-remember-me"
        />
        <span class="font-medium">Remember me</span>
      </label>

      <button
        type="button"
        class="text-sm font-semibold text-accent-600 transition hover:text-accent-500"
        (click)="forgotPassword.emit()"
      >
        Forgot password?
      </button>
    </div>

    <div class="pt-2">
      <app-button type="submit" [fullWidth]="true" [loading]="loading()" [testId]="'login-submit'">
        Log in
      </app-button>
    </div>

  </form>
</section>
