<header class="auth-header">
  <div class="auth-header__top">
    <app-brand-logo size="md" />
    <app-badge [tone]="badgeTone()">{{ badgeLabel() }}</app-badge>
  </div>

  <div class="auth-header__title-row">
    <span class="auth-header__icon" aria-hidden="true">
      <app-icon [name]="icon()" [size]="18" />
    </span>
    <h1>{{ title() }}</h1>
  </div>

  <p>{{ description() }}</p>
</header>
