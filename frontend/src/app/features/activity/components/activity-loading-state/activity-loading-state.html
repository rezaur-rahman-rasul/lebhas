<section class="grid gap-3" [attr.aria-label]="label()" aria-busy="true">
  @for (row of rows; track row) {
    <article class="rounded-lg border border-border bg-surface p-5">
      <div class="flex animate-pulse gap-3">
        <div class="size-10 shrink-0 rounded-md bg-panel"></div>
        <div class="min-w-0 flex-1 space-y-3">
          <div class="h-3 w-32 rounded bg-panel"></div>
          <div class="h-4 w-2/3 rounded bg-panel"></div>
          <div class="h-3 w-full rounded bg-panel"></div>
          <div class="grid gap-3 sm:grid-cols-3">
            <div class="h-3 rounded bg-panel"></div>
            <div class="h-3 rounded bg-panel"></div>
            <div class="h-3 rounded bg-panel"></div>
          </div>
        </div>
      </div>
    </article>
  }
</section>
