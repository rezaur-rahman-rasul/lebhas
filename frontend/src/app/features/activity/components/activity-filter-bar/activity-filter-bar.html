<section
  class="grid gap-3 rounded-lg border border-border bg-surface p-4 md:grid-cols-[minmax(10rem,1.1fr)_minmax(10rem,1fr)_repeat(2,minmax(9rem,0.8fr))_auto] md:items-end"
  aria-label="Activity filters"
>
  <label class="grid gap-2 text-sm text-ink">
    <span class="font-medium">Activity type</span>
    <select
      class="h-10 min-w-0 rounded-md border border-border bg-panel px-3 text-sm text-ink outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30"
      [value]="selectedActivityType() || ''"
      (change)="updateType($any($event.target).value)"
    >
      <option value="">All activity</option>
      @for (type of activityTypes; track type) {
        <option [value]="type">{{ typeLabel(type) }}</option>
      }
    </select>
  </label>

  <label class="grid gap-2 text-sm text-ink">
    <span class="font-medium">Actor</span>
    <input
      type="search"
      class="h-10 min-w-0 rounded-md border border-border bg-panel px-3 text-sm text-ink outline-none transition placeholder:text-muted focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30"
      placeholder="User or member ID"
      [value]="selectedActor() || ''"
      (input)="updateActor($any($event.target).value)"
    />
  </label>

  <label class="grid gap-2 text-sm text-ink">
    <span class="font-medium">From</span>
    <input
      type="date"
      class="h-10 min-w-0 rounded-md border border-border bg-panel px-3 text-sm text-ink outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30"
      [value]="selectedDateRange()?.from || ''"
      (change)="updateFrom($any($event.target).value)"
    />
  </label>

  <label class="grid gap-2 text-sm text-ink">
    <span class="font-medium">To</span>
    <input
      type="date"
      class="h-10 min-w-0 rounded-md border border-border bg-panel px-3 text-sm text-ink outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30"
      [value]="selectedDateRange()?.to || ''"
      (change)="updateTo($any($event.target).value)"
    />
  </label>

  <div class="flex flex-col gap-2 sm:flex-row md:justify-end">
    <app-button
      type="button"
      variant="secondary"
      icon="rotate-cw"
      [loading]="loading()"
      ariaLabel="Refresh activity feed"
      (click)="refresh.emit()"
    >
      Refresh
    </app-button>
    <app-button
      type="button"
      variant="ghost"
      icon="x"
      ariaLabel="Clear activity filters"
      (click)="clear.emit()"
    >
      Clear
    </app-button>
  </div>
</section>
