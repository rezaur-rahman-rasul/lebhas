<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lebhas - Brand Attire</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b17">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('creative_saas.theme') === 'light' ? 'light' : 'dark';
        const root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.dataset.theme = theme;
      } catch {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
